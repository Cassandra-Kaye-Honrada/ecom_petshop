{% extends "admin/layouts/base.html" %} {% block content %}

<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title"><i class="fas fa-key"></i> Reset Password</h3>
        </div>
        <div class="card-body">
          <div class="alert alert-warning">
            <i class="fas fa-exclamation-triangle"></i>
            <strong>Reset password for:</strong> {{ user.firstname }} {{
            user.lastname }}
          </div>

          <form method="post">
            <!-- <input type="hidden" name="user_id" value="{{ user.id }}" /> -->
            <!-- <input type="hidden" name="username" value="{{ user.username }}" /> -->

            <div class="mb-3">
              <label for="new_password" class="form-label"
                >New Password <span class="text-danger">*</span></label
              >
              <input
                type="password"
                class="form-control {% if errors['new'] %} error-field {% endif %}"
                id="new_password"
                name="new_password"
              />
              {% if errors.new %}
              <span class="text-danger">{{ errors.new }}</span>
              {% endif %}
            </div>

            <div class="mb-3">
              <label for="confirm_password" class="form-label"
                >Confirm Password <span class="text-danger">*</span></label
              >
              <input
                type="password"
                class="form-control {% if errors['confirm'] %} error-field {% endif %}"
                id="confirm_password"
                name="confirm_password"
              />

              {% if errors.confirm %}
              <span class="text-danger">{{ errors.confirm }}</span>
              {% endif %}
            </div>

            <div class="d-flex justify-content-between">
              <a href="{{ url_for('manage_users') }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Users
              </a>
              <button type="submit" class="btn btn-warning">
                <i class="fas fa-key"></i> Reset Password
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
